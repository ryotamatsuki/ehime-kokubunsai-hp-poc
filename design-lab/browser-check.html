<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>公開配信のブラウザー検査</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecece8;color:#151d36;font:16px/1.6 system-ui,sans-serif}header{padding:16px 20px;background:#fffdf8;border-bottom:1px solid #b9bdc5}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0}label{display:inline-block;margin-right:12px}select,button{font:inherit;padding:8px;min-height:44px;border:1px solid #6d7380;background:#fffdf8;color:#151d36}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #183c9e;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stage{overflow:auto;padding:12px}iframe{display:block;border:0;box-shadow:0 0 0 1px #b9bdc5;background:#f5f2ea;height:1000px;margin:0 auto}details{padding:12px 20px;background:#fffdf8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace;max-height:420px;overflow:auto}.note{max-width:1000px;font-size:14px}#state{font-weight:600}
</style></head><body><header><h1>公開配信のブラウザー検査</h1><p class="note">通常ページを同じオリジンから読み、実際のCSS・Webフォント・画像で確認します。幅はiframe内のCSS表示幅です。実機、通信制限、読み上げの監査は別途必要です。</p><label>ページ<select id="page"><option value="index.html">トップ</option><option value="culture/field-notes.html">文化の記録</option><option value="culture/literature.html">文学・ことば</option><option value="culture/craft.html">工芸・絵付け</option><option value="events/search.html">催しの検索</option><option value="events/stage.html">舞台の催し</option><option value="culture/notebook.html">文化帖</option><option value="recruitment/index.html">参加・募集</option><option value="sponsors/index.html">協賛</option><option value="committee/overview.html">実行委員会・資料</option><option value="access/train.html">交通</option><option value="accessibility/information-support.html">参加の支援</option><option value="contact/form.html">問い合わせの表示例</option><option value="common/search.html">サイト内検索</option><option value="site-map.html">全案内</option></select></label><label>CSS表示幅<select id="width"><option>390</option><option>320</option><option>1024</option><option selected>1440</option></select></label><div class="actions"><button id="open">表示する</button><button id="inspect">現在の表示を検査</button><button id="suite">主要ページを320 / 390 / 1440pxで検査</button><button id="export">記録をJSON保存</button></div><p id="state" role="status">表示を準備しています。</p></header><details><summary>検査記録</summary><pre id="report"></pre></details><main class="stage"><iframe id="preview" title="通常配信の実表示"></iframe></main><script>
const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),state=document.getElementById('state'),report=document.getElementById('report');
const records=[];let observers=[],timing={lcp:null,lcpElement:null,shifts:[],events:[]};
function observe(){observers.forEach(o=>o.disconnect());observers=[];timing={lcp:null,lcpElement:null,shifts:[],events:[]};const win=frame.contentWindow;
 for(const type of ['largest-contentful-paint','layout-shift','event'])try{const observer=new win.PerformanceObserver(list=>{for(const item of list.getEntries()){if(type==='largest-contentful-paint'){timing.lcp=item.startTime;timing.lcpElement=item.element?.tagName||null}else if(type==='layout-shift'&&!item.hadRecentInput)timing.shifts.push({time:item.startTime,value:item.value});else if(type==='event')timing.events.push({name:item.name,duration:item.duration,interactionId:item.interactionId})}});observer.observe({type,buffered:true,...(type==='event'?{durationThreshold:16}:{})});observers.push(observer)}catch(_){}
}
function cls(){let max=0,sum=0,start=0,last=0;for(const x of timing.shifts){if(x.time-last>1000||x.time-start>5000){sum=0;start=x.time}sum+=x.value;max=Math.max(max,sum);last=x.time}return +max.toFixed(5)}
function rounded(n){return Math.round(n*100)/100}
function inspect(){const win=frame.contentWindow,doc=frame.contentDocument,viewport=doc.documentElement.clientWidth,style=win.getComputedStyle(doc.body);const outside=[];const walk=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
 while(walk.nextNode()){const node=walk.currentNode;if(!node.textContent.trim()||node.parentElement.closest('script,style,.sr-only,[hidden]'))continue;const range=doc.createRange();range.selectNodeContents(node);for(const rect of range.getClientRects())if(rect.width&&rect.height&&(rect.left< -1||rect.right>viewport+1)){outside.push({text:node.textContent.trim().slice(0,100),left:rounded(rect.left),right:rounded(rect.right)});break}}
 const controls=[...doc.querySelectorAll('button,input,select,textarea,a')].filter(e=>!e.closest('[hidden],.sr-only')).flatMap(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&(r.left< -1||r.right>viewport+1)?[{text:(e.innerText||e.getAttribute('aria-label')||e.tagName).slice(0,100),left:rounded(r.left),right:rounded(r.right)}]:[]});
 const resources=win.performance.getEntriesByType('resource'),navigation=win.performance.getEntriesByType('navigation')[0],images=[...doc.images].filter(i=>i.complete),heading=doc.querySelector('h1'),hero=doc.querySelector('.festival-panorama img');
 const row={time:new Date().toISOString(),url:win.location.href,cssViewport:win.innerWidth,availableContentWidth:viewport,devicePixelRatio:win.devicePixelRatio,bodyFont:{family:style.fontFamily,size:style.fontSize},heading:heading?{text:heading.innerText,font:win.getComputedStyle(heading).fontFamily,size:win.getComputedStyle(heading).fontSize}:null,hero:hero?{top:rounded(hero.getBoundingClientRect().top+win.scrollY),source:hero.currentSrc,naturalWidth:hero.naturalWidth}:null,notice:doc.querySelector('.poc-banner')?.innerText,fontsStatus:doc.fonts.status,documentWidth:doc.documentElement.scrollWidth,textOutside:outside,controlsOutside:controls,completedImages:images.length,brokenImages:images.filter(i=>i.naturalWidth===0).map(i=>i.currentSrc),navigationMs:navigation?{response:rounded(navigation.responseEnd),domContentLoaded:rounded(navigation.domContentLoadedEventEnd),load:rounded(navigation.loadEventEnd)}:null,resources:{requests:resources.length,transferredBytes:resources.reduce((n,r)=>n+r.transferSize,0),encodedBodyBytes:resources.reduce((n,r)=>n+r.encodedBodySize,0),fontRequests:resources.filter(r=>r.name.endsWith('.woff2')).map(r=>({url:r.name,bytes:r.encodedBodySize,durationMs:rounded(r.duration)}))},observedPaint:{lcpMs:timing.lcp,element:timing.lcpElement,cls:cls(),longestObservedInteractionMs:timing.events.filter(e=>e.interactionId).reduce((n,e)=>Math.max(n,e.duration),0)||null},limits:'One unthrottled Chrome iframe run; cache may be reused, lazy images counted only if completed; paint values concern the embedded viewport. No field Core Web Vitals or screen-reader conformance claim.'};
 records.push(row);report.textContent=JSON.stringify({version:'2.0.0-alpha.6',method:'Native Chrome with normal same-origin delivery, fonts and responsive images',records},null,2);state.textContent=`${page.options[page.selectedIndex].text} / ${viewport}px：本文の画面外${outside.length}、操作の画面外${controls.length}、画像エラー${row.brokenImages.length}`;return row;
}
function load(){return new Promise((resolve,reject)=>{frame.style.width=width.value+'px';state.textContent='読み込み中…';const timer=setTimeout(()=>reject(Error('page load timeout')),20000);frame.onload=async()=>{try{observe();await frame.contentDocument.fonts.ready;await new Promise(r=>setTimeout(r,300));clearTimeout(timer);resolve(inspect())}catch(e){clearTimeout(timer);reject(e)}};frame.src=new URL('../'+page.value,location.href).href})}
document.getElementById('open').onclick=()=>load().catch(e=>state.textContent=e.message);document.getElementById('inspect').onclick=inspect;
document.getElementById('suite').onclick=async()=>{const button=document.getElementById('suite');button.disabled=true;try{for(const option of page.options)for(const pixels of ['320','390','1440']){page.value=option.value;width.value=pixels;await load()}state.textContent=`主要15ページ、45表示を検査しました。記録を確認してください。`}catch(e){state.textContent=e.message}finally{button.disabled=false}};
document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([report.textContent],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='browser-delivery-checks.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};load().catch(e=>state.textContent=e.message);
</script></body></html>
